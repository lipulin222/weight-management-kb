const DOCS = {"D01":"# D01 · 这份评估在测什么\r\n\r\n\u003e 导语：每个问题都对应一条判断依据。\r\n\r\n## 01 为什么要问这些\r\n\r\n- **身高、体重、腰围** —— 看代谢风险落在哪个范围。\r\n- **病史** —— 有些病会改变用药的风险。\r\n- **正在吃的药** —— 看有没有相互影响。\r\n- **月经、备孕** —— 特殊阶段的处理方式不同。\r\n- **过敏史** —— 决定能不能用、用哪一种。\r\n\r\n## 02 填的时候注意\r\n\r\n- 不确定的就写「不确定」，别猜一个填上去。\r\n- 想不起具体药名 —— 写用途和大概时间，医生会再问。\r\n- 填错了 —— 提交前可以改；已提交的联系顾问更正。\r\n\r\n## 03 结论说「适合」是什么意思\r\n\r\n- 是初步匹配，不等于可以用了 —— 见「为什么还要医生再看一遍」。\r\n- 能不能用、怎么用，由医生给结论。\r\n\r\n## 04 结论说「不适合」怎么办\r\n\r\n- 见「不适合用药的人，还能怎么减」。\r\n\r\n## 05 你填的信息怎么用\r\n\r\n- 只用于评估和方案 —— 见「你的健康数据怎么被使用」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","D02":"# D02 · 为什么还要医生再看一遍\r\n\r\n\u003e 导语：评估负责收集信息，能不能用药由医生定。\r\n\r\n## 01 评估先做两件事\r\n\r\n- 把明显不适合的情况筛出来。\r\n- 把需要检查、需要到院的情况标出来。\r\n\r\n## 02 医生在这几步做决定\r\n\r\n- **核对信息** —— 病史、用药史、过敏史逐条过一遍。\r\n- **看检查结果** —— 查有没有还没查清的部分。\r\n- **定方案** —— 起步多少、怎么调，由医生写。\r\n- **开处方** —— 处方只能由医生出。\r\n\r\n## 03 线上怎么完成\r\n\r\n- 资料齐、情况不复杂 —— 医生线上确认即可开方。\r\n- 医生会核对你的记录，也可能再问几个细节 —— 提前把在吃的药和报告准备好。\r\n- 需要检查或核实体征 —— 按提示准备资料，检查项由医生定。\r\n\r\n## 04 两件事别混在一起\r\n\r\n- **评估结果不等于处方** —— 说「适合」是初步匹配，不等于可以用了。\r\n- **医生确认不等于到院** —— 线上确认也是确认，不是所有人都要跑一趟。\r\n\r\n## 05 结论出来之后\r\n\r\n- 可以用 —— 按方案起步。\r\n- 需要先检查或面诊 —— 按提示准备。\r\n- 暂时不适合 —— 见「不适合用药的人，还能怎么减」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","D03":"# D03 · 什么情况下需要到医院或做检查\r\n\r\n\u003e 导语：多数人全程线上完成，这几类情况需要到院或先做检查。\r\n\r\n## 01 需要到院的情况\r\n\r\n- 有必须当面核实才能判断的体征 —— 医生会说明是哪一项。\r\n- 指标异常需要复查确认 —— 医生会直接告诉你。\r\n- 线上资料不足以判断 —— 由医生提出面诊。\r\n\r\n## 02 需要做检查的情况\r\n\r\n- 基线指标不清楚 —— 先把血糖、血脂、肝肾这些查清楚。\r\n- 有用药前必须确认的项目 —— 由医生列给你。\r\n- 复查节点到了 —— 按方案安排。\r\n\r\n## 03 检查项目不是固定的\r\n\r\n- 查哪些由医生按你的情况定，不照别人的清单做。\r\n- 最近在别处做过的检查 —— 带上报告，能不能免做由医生定。\r\n\r\n## 04 结果异常不等于不能用\r\n\r\n- 医生会说明这个结果意味着什么。\r\n- 需要先处理的问题 —— 处理完再评估，见「不适合用药的人，还能怎么减」。\r\n\r\n## 05 异地、没时间怎么办\r\n\r\n- 多数检查可以在当地做，报告线上提交。\r\n- 哪些必须在本院做 —— 问顾问，由医生确认。\r\n- 要做的检查怎么准备 —— 见「如果需要检查，怎么准备」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","D04":"# D04 · 如果需要检查，怎么准备\r\n\r\n\u003e 导语：先问清查什么、要不要空腹，再安排时间。\r\n\r\n## 01 先让医生把项目列清楚\r\n\r\n- 查哪些项目由医生按你的情况定，不照别人的清单做。\r\n- 问清哪些要空腹、要不要停针 —— 写进你的日程。\r\n- 最近在别处做过的检查 —— 带报告问医生能不能免做，见「什么情况下需要到医院或做检查」。\r\n\r\n## 02 空腹项目怎么安排\r\n\r\n- 需要空腹的排在早上，做完再吃饭。\r\n- 空腹期间可以喝水，不喝含糖饮料。\r\n- 平时要吃的药，问医生能不能照常吃，不自行停。\r\n\r\n## 03 当天带什么\r\n\r\n- 正在吃的药和补充剂清单。\r\n- 以往的检查报告和就诊记录。\r\n- 复查时要带的记录，见「复查怎么准备」。\r\n\r\n## 04 结果出来之后\r\n\r\n- 出结果的时间按项目定，结果在同一处查看。\r\n- 结果由医生解读 —— 不自己对着参考值下结论。\r\n- 某项异常 —— 由医生说明意味着什么，不等于不能用。\r\n\r\n## 05 异地、没时间怎么办\r\n\r\n- 多数项目可以在当地医院做，报告线上提交。\r\n- 哪些必须在本院做 —— 问顾问，由医生确认。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","D05":"# D05 · 不适合用药的人，还能怎么减\r\n\r\n\u003e 导语：不能用药不等于减不了，路径换一条。\r\n\r\n## 01 先问清是哪一条不适合\r\n\r\n- 问清是不适合用药，还是需要先处理别的问题。\r\n- 问清是暂时的还是长期的 —— 拿到明确说法，别自己猜。\r\n- 结论来自检查或病史 —— 可以请医生说明依据。\r\n\r\n## 02 有些情况先把基础问题处理掉\r\n\r\n- **代谢问题** —— 血糖、血脂、甲状腺先控住。\r\n- **在吃的药** —— 有些药会影响体重，看能不能调整。\r\n- **睡眠问题** —— 打鼾、睡不好会影响体重管理。\r\n\r\n## 03 不用药也能做的五件事\r\n\r\n- **定一个能长期坚持的饭量** —— 比现在少吃一点，不靠饿。\r\n- **每餐先吃够蛋白质** —— 肉、蛋、奶、豆。\r\n- **每周做两三次力量训练** —— 保住肌肉。\r\n- **固定每周称一次体重** —— 看趋势，不盯单日。\r\n- **把记录留着** —— 复查和再评估都要用。\r\n\r\n## 04 「先减几斤再来」怎么看\r\n\r\n- 减重靠的是长期习惯，不是先饿几斤达到标准就能用。\r\n- 能不能用要重新评估，不是体重降下来就行。\r\n\r\n## 05 这一段也有人管\r\n\r\n- 饮食、运动、记录的问题随时可以问顾问。\r\n- 之后想重新评估 —— 按流程再走一次。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","D06":"# D06 · 你的健康数据怎么被使用\r\n\r\n\u003e 导语：只用于给你做评估和方案，用途可查，也可以要求删除。\r\n\r\n## 01 数据用来做什么\r\n\r\n- **评估能不能用药** —— 病史、用药史交给医生判断。\r\n- **制定和调整方案** —— 体重、饮食、反应记录。\r\n- **复查与随访** —— 前后对比，看变化和趋势。\r\n\r\n## 02 谁能看到\r\n\r\n- 你的医生，和负责你这一段服务的顾问。\r\n- 药师与配送环节只看药品和配送需要的信息。\r\n- 不对外共享，不做与你的服务无关的用途。\r\n\r\n## 03 你可以做的三件事\r\n\r\n- **查看** —— 在服务里查看自己填过的内容和记录。\r\n- **更正** —— 填错了随时改，或让顾问改。\r\n- **删除** —— 按流程申请删除，细则见隐私与授权页。\r\n\r\n## 04 照片、聊天记录与回顾报告\r\n\r\n- 照片和聊天记录按同样口径管理，不另行使用。\r\n- 回顾报告要不要给别人看，由你自己决定，见「怎么看待这一段的变化」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","E01":"# E01 · 什么时候可以停药\r\n\r\n\u003e 导语：停药由医生综合判断，不看某一个数字到没到。\r\n\r\n## 01 医生会综合这几件事\r\n\r\n- **体重与腰围** —— 有没有达到目标，并且稳得住。\r\n- **代谢指标** —— 血糖、血脂有没有跟着改善。\r\n- **吃饭和运动习惯** —— 是不是已经稳定成型。\r\n- **停药后的反弹风险** —— 因人而异，由医生估。\r\n\r\n## 02 去复查前整理好\r\n\r\n- 把体重、腰围、反应记录按时间整理好，带过去。\r\n- 想停药的理由说清楚 —— 医生据此判断是减、维持还是换方案。\r\n\r\n## 03 不能自己决定的部分\r\n\r\n- **停药与减量由医生定** —— 常见的做法是逐步减，不是直接停。\r\n- 体重到了目标不等于可以停 —— 看的是整体，不是单个数字。\r\n\r\n## 04 停药之后\r\n\r\n- 维持期的节奏见「停药之后怎么维持住」。\r\n- 之后多久复查一次，按医生复查时说的来。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","E02":"# E02 · 停药之后怎么维持住\r\n\r\n\u003e 导语：停药不是结束，这段时间怎么过，决定体重怎么回来。\r\n\r\n## 01 三件要坚持的事\r\n\r\n- **吃够蛋白质、保住肌肉** —— 基础代谢靠肌肉托着。\r\n- **每周做两三次力量训练** —— 维持期的体重也靠它。\r\n- **继续记体重** —— 有变化能早点发现。\r\n\r\n## 02 数字怎么读\r\n\r\n- 小范围上下浮动是正常的，不因为某天涨了就少吃。\r\n- 连续几周单向上涨 —— 联系我们，别等到明显反弹。\r\n\r\n## 03 复查与求助\r\n\r\n- 复查按医生排的节奏走，重点看代谢指标。\r\n- 吃的东西又开始控制不住 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","E03":"# E03 · 停药后的随访节奏\r\n\r\n\u003e 导语：停药之后还要复查，节奏由上一次复查交代。\r\n\r\n## 01 停了还要复查\r\n\r\n- **要复查** —— 停药后体重和代谢指标还会动，需要有人看。\r\n- **节奏按医生说的来** —— 上一次复查时会交代下一次。\r\n- 没记下时间 —— 问顾问，写进你的日程。\r\n\r\n## 02 复查看什么\r\n\r\n- **体重与腰围** —— 看趋势有没有往回走。\r\n- **血糖、血脂** —— 代谢指标比体重更早反映变化。\r\n- 查哪些项目由医生按你的情况定，不是每次都一样。\r\n\r\n## 03 两次复查之间\r\n\r\n- 按约好的时间回来，体重没变也要去。\r\n- 体重和吃饭继续记 —— 医生要看这段时间的变化。\r\n\r\n## 04 这些情况提前联系我们\r\n\r\n- 体重连续几周单向往上走 —— 联系我们，别等到明显反弹。\r\n- 吃的东西又开始控制不住 —— 联系我们。\r\n- 想重新开始用药 —— 联系我们，由医生评估。\r\n\r\n## 05 谁在跟进\r\n\r\n- 复查结果由医生解读，结论在同一处看。\r\n- 平时的记录和问题问顾问，维持期怎么过见「停药之后怎么维持住」。\r\n- 维持期还要不要付费 —— 问顾问，按服务口径算。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","G01":"# G01 · 怎么看待这一段的变化\r\n\r\n\u003e 导语：体重之外，还有几样变化也值得记下来。\r\n\r\n## 01 先看数字\r\n\r\n- **体重与腰围** —— 从开始到现在的变化，看趋势不看某一天。\r\n- **代谢指标** —— 血糖、血脂的前后对比，复查报告里有。\r\n- **这段时间有多长** —— 自己心里有个数。\r\n\r\n## 02 再看身体感受\r\n\r\n- 走路、爬楼、蹲下起身比之前轻松。\r\n- 睡觉打鼾和白天犯困减轻。\r\n- 衣服尺码、腰带孔位的变化。\r\n\r\n## 03 最后看习惯\r\n\r\n- 吃饭的顺序和分量是不是已经固定下来。\r\n- 运动有没有变成每周的固定安排。\r\n- 记录还在不在坚持。\r\n\r\n## 04 接下来干什么\r\n\r\n- 还在用药 —— 按方案继续，见「剂量是怎么一步步调的」。\r\n- 已经停药 —— 见「停药之后怎么维持住」和「停药后的随访节奏」。\r\n\r\n## 05 报告与隐私\r\n\r\n- 回顾报告是你自己的，要不要给别人看由你决定。\r\n- 数据怎么被使用，见「你的健康数据怎么被使用」。\r\n- 推荐给朋友有没有奖励 —— 问顾问，按当时的活动规则。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","K01":"# K01 · GLP-1 是怎么帮你减重的\r\n\r\n\u003e 导语：它不是燃脂药，是让你重新收到「吃饱了」的信号。\r\n\r\n## 01 它作用在三个地方\r\n\r\n- **给大脑饱的信号** —— 让你更快觉得够。\r\n- **让胃排空变慢** —— 吃完更久不觉得饿。\r\n- **平稳餐后血糖** —— 饭后血糖不起大落，想吃的冲动跟着少。\r\n\r\n## 02 它不做什么\r\n\r\n- **不直接消耗脂肪** —— 体重下降来自吃得少，不是药在燃脂。\r\n- **不减局部** —— 先掉哪里因人而异。\r\n- **不替代吃饭和运动** —— 停药之后能不能维持住，取决于习惯。\r\n\r\n## 03 用药之后先感觉到什么\r\n\r\n- 饱得快、饿得慢，是最先出现的变化。\r\n- 有饱胀、恶心这类反应 —— 见「用药后的反应怎么应对」。\r\n- 反应不明显 —— 见「没明显反应，怎么判断药有没有起效」。\r\n\r\n## 04 怎么配合它\r\n\r\n- 先吃蛋白质，再吃蔬菜，主食放最后。\r\n- 每周做两三次力量训练，保住肌肉。\r\n- 记录体重和吃饭情况，复查时医生据此调方案。\r\n\r\n## 05 为什么不能自己买了打\r\n\r\n- 需要医生评估后开方 —— 有些情况本来不适合用。\r\n- 剂量与间隔由处方定 —— 不抄别人的用法。\r\n- 药只从正规渠道来 —— 收到后核对包装和有效期。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","K02":"# K02 · 什么样的人适合医疗级减重\r\n\r\n\u003e 导语：医生看的是整体代谢，不只看体重。\r\n\r\n## 01 先看三项身体指标\r\n\r\n- **体重指数** —— 达到需要医疗介入的范围才考虑。\r\n- **腰围** —— 肚子上的脂肪和代谢风险关系更紧。\r\n- **血糖、血脂、血压** —— 有没有跟着一起异常。\r\n\r\n## 02 减重能改善什么\r\n\r\n- **代谢指标** —— 血糖、血脂跟着改善，是复查要看的结果。\r\n- **脂肪肝与睡眠** —— 体重降下来，打鼾和白天犯困常常跟着减轻。\r\n- **关节负担** —— 膝盖、腰背的承重不适会小一些。\r\n\r\n## 03 这些情况交医生判断\r\n\r\n- 有甲状腺、胰腺、胆囊、肝肾方面的问题 —— 由医生判断。\r\n- 正在吃降压药、避孕药、抗抑郁药 —— 把药名发给医生核对。\r\n- 做过胃肠道手术 —— 由医生判断。\r\n- 备孕、怀孕或哺乳 —— 由医生判断。\r\n- 年龄偏小或偏大 —— 由医生判断。\r\n\r\n## 04 体重不高、只想瘦几斤\r\n\r\n- 只想小幅度调整 —— 先看饮食和运动能不能做到，不必用药。\r\n- 肚子大但体重正常 —— 让医生看腰围和代谢指标再定。\r\n\r\n## 05 以前减不下来不代表这次一样\r\n\r\n- 反复节食反弹，和药物起作用的地方不是同一回事。\r\n- 能不能用、怎么用，结论由医生给。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","K03":"# K03 · 一个完整疗程是怎么进行的\r\n\r\n\u003e 导语：评估、起步、调整、维持，每一段要做的事不同。\r\n\r\n## 01 第一段 评估与确认\r\n\r\n- 填健康评估，把病史、用药史、过敏史写全。\r\n- 医生复核后给结论，见「为什么还要医生再看一遍」。\r\n- 需要检查的先把检查做了，按流程提示准备。\r\n\r\n## 02 第二段 起步与爬坡\r\n\r\n- 从低剂量起步，按方案慢慢往上走，见「剂量是怎么一步步调的」。\r\n- 这一段主要是适应反应，见「用药第一周，身体会有哪些反应」。\r\n- 记录体重、吃饭和反应，别只盯体重一个数。\r\n\r\n## 03 第三段 持续与调整\r\n\r\n- 按医生排的节点复查，见「复查都看哪些指标」。\r\n- 体重长期不动 —— 见「平台期怎么判断」。\r\n- 方案由复查结果决定，不自己加量或减量。\r\n\r\n## 04 第四段 停药与维持\r\n\r\n- 什么时候停、怎么停，由医生判断，见「什么时候可以停药」。\r\n- 停药之后怎么过，见「停药之后怎么维持住」。\r\n\r\n## 05 谁负责哪一段\r\n\r\n- **医生** —— 判断能不能用、给方案、看复查结果。\r\n- **健康顾问** —— 记录、提醒，随时可以问。\r\n- **你自己** —— 用药、吃饭、运动、记录。\r\n- 多数环节可以线上完成，需要检查或核实体征时才到院。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","K04":"# K04 · 效果怎么看，多久算有变化\r\n\r\n\u003e 导语：看连起来的趋势，不看某一次的数字。\r\n\r\n## 01 先看趋势，不看单次\r\n\r\n- **每周固定一天称** —— 同一时间、同样条件，数字才有可比性。\r\n- **看几周连成的线** —— 单日涨跌受水分、盐分和排便影响。\r\n- 体重没动但腰围小了 —— 也是变化，两个一起记。\r\n\r\n## 02 除了体重还看什么\r\n\r\n- **腰围** —— 肚子上的变化常常先于体重出现。\r\n- **吃饭时的饱感** —— 吃得更少就饱了，说明药在起作用。\r\n- **血糖、血脂** —— 复查时看，反应比体重更早。\r\n\r\n## 03 多久算有变化\r\n\r\n- 按医生说的节奏看，不在一两周内下结论。\r\n- 体重长期不动 —— 见「平台期怎么判断」。\r\n- 感觉完全没变化 —— 见「没明显反应，怎么判断药有没有起效」。\r\n\r\n## 04 为什么有人快有人慢\r\n\r\n- 起点体重、饮食习惯、运动量都不一样，不跟别人比。\r\n- 以前节食减不下来和这次的机制不同，不是同一回事。\r\n\r\n## 05 效果不理想怎么处理\r\n\r\n- 不自己加量 —— 按复查结果由医生决定，见「复查都看哪些指标」。\r\n- 要不要换方案 —— 由医生判断，不自行换药。\r\n\r\n## 06 减的是脂肪还是水分\r\n\r\n- 掉得太快容易掉肌肉 —— 见「掉得太快怎么处理」。\r\n- 保住肌肉靠蛋白质和力量训练，见「吃得少了，怎么保证营养」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","K06":"# K06 · 它和节食、代餐、运动有什么不同\r\n\r\n\u003e 导语：区别在起作用的地方，不在努不努力。\r\n\r\n## 01 和节食比\r\n\r\n- 节食靠忍 —— 饿的感觉一直在，停下来容易回来。\r\n- 用药是改饱的信号 —— 让你更容易做到少吃。\r\n- 两条路都要管住嘴 —— 药不替代吃饭结构的调整。\r\n\r\n## 02 和代餐、轻断食比\r\n\r\n- 代餐、轻断食是控制摄入的**方式** —— 关键是有没有长期做下去。\r\n- 用药是在生理信号上帮忙 —— 两者不排斥，可由医生一起安排。\r\n- 其他减重药物 —— 成分和作用不同，不做对比，由医生判断能不能用。\r\n\r\n## 03 和减重手术比\r\n\r\n- 手术是有创操作，适用于特定情况 —— 由外科医生评估。\r\n- 用药可逆、可调整 —— 由医生判断你更适合哪一条。\r\n\r\n## 04 和私教、营养师方案比\r\n\r\n- 教练和营养师管执行 —— 吃和练怎么安排。\r\n- 医生管判断 —— 能不能用、怎么用、有没有风险。\r\n- 两者一起用更好，不互相替代。\r\n\r\n## 05 能不能自己买药来打\r\n\r\n- 不能 —— 处方药要医生评估后开方，见「为什么还要医生再看一遍」。\r\n- 自行买来的药，来源和用法都没有保障。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","M01":"# M01 · 剂量是怎么一步步调的\r\n\r\n\u003e 导语：剂量是慢慢往上走的，不是一次到位。每一档停多久、由谁决定调，一起了解一下。\r\n\r\n## 01 为什么从小剂量开始\r\n\r\n- 让身体先适应，把恶心、腹胀这类反应**控制在**不影响吃饭和上班的程度。\r\n- 一上来就用大剂量，反应更重，更容易中断，对坚持下来没有好处。\r\n\r\n## 02 每一档怎么往上走\r\n\r\n- 每一档都有一段观察期，**多久、下一档多少，以你的处方为准**。\r\n- 往上调之前看三样：反应能不能耐受、体重和腰围的周趋势、复查指标。\r\n\r\n## 配图（第 02 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：每一档停多久、下一档多少，按你的处方来。示意图，不代表具体剂量。\r\n\r\n## 03 调完之后会有什么\r\n\r\n- 适应期的反应可能再出现一轮，一般比第一次轻。应对办法见「用药后的反应怎么应对」。\r\n- 反应没加重，不代表剂量不够；反应重，也不代表效果好。\r\n\r\n## 04 调不调谁说了算\r\n\r\n- 由医生按复查结果决定，**不自行调整剂量，也不提前调**。\r\n- 想加快、想停在这一档、想回到上一档，把想法告诉医生，由医生判断。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M02":"# M02 · 平台期怎么判断\r\n\r\n\u003e 导语：连着两周体重不动，先别急着加量，多数时候问题出在别处。\r\n\r\n## 01 先确认是不是平台期\r\n\r\n- 连着**两周以上的周均值基本不动**，才算平台期。\r\n- 单周停一下是正常的，先不用当回事。\r\n\r\n## 配图（第 01 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：连着两周以上走平，才算平台期。示意图，不代表之后会怎么走。\r\n\r\n## 02 先排查这四件事\r\n\r\n- 记三天饮食，看是不是不知不觉吃回来了。\r\n- 看蛋白质够不够、力量练习有没有落下。\r\n- 看睡眠和情绪，这两项会直接拖慢进度。\r\n- 看有没有漏打，注射的日子有没有来回漂。\r\n\r\n## 03 平台期本身要处理吗\r\n\r\n- 它是身体适应了当前节奏的现象，几乎每个人都会遇到，不等于方案失效。\r\n- 会持续多久没有固定答案，因人而异。\r\n\r\n## 04 接下来怎么走\r\n\r\n- 把上面四项的结果和体重记录一起交给医生，由医生判断要不要调方案。\r\n- 按上面四项调整两三周还是不动 —— 联系我们。\r\n- **不自行调整剂量，也不自行换药**。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M03":"# M03 · 掉得太快怎么处理\r\n\r\n\u003e 导语：掉得快不全是好事，水分和肌肉可能一起走。\r\n\r\n## 01 速度不等于成绩\r\n\r\n- 掉得急的阶段，减掉的水分和肌肉占的比例更高，体重看着漂亮，身体不一定更好。\r\n- 我们看的是**周均值往下的趋势**，不是某一周掉了多少。\r\n\r\n## 02 掉太快会出现什么\r\n\r\n- 乏力、头晕，蹲下再站起来眼前发黑。\r\n- 力量下降，爬楼、拎东西比以前吃力。\r\n- 脸色差、面部线条塌下来、掉头发，见「减重期间的面部与皮肤变化」「掉头发怎么处理」。\r\n\r\n## 03 把速度放稳的做法\r\n\r\n- **每餐先吃蛋白质**，饭量别再往下压。\r\n- 每周安排力量练习，别只做走路和跑步。\r\n- 吃不下的时候，从吃法上想办法，不用「再少吃一点」换速度。\r\n\r\n## 04 什么时候联系医生\r\n\r\n- 下降明显快于前几周的节奏 —— 联系我们，由医生判断要不要调方案。\r\n- 已经出现乏力、头晕并影响到工作和生活 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M04":"# M04 · 减重期间的面部与皮肤变化\r\n\r\n\u003e 导语：瘦得快的时候，脸会比身材先显出来，应对方案也很成熟。\r\n\r\n## 01 为什么会松\r\n\r\n- 体重下来时，面部的皮下脂肪先减少，皮肤和支撑组织回缩的速度跟不上，于是出现凹陷、法令纹变深、看上去疲惫。\r\n- 网上说的「司美脸」讲的就是这个现象：**快速减重之后都可能出现**，不是某一支药独有的。\r\n\r\n## 02 什么时候更明显\r\n\r\n- 下降快的那段时间，以及原本面部就比较瘦的人，更明显。\r\n- 抽烟、日晒、熬夜会拖慢皮肤回弹。\r\n\r\n## 03 可以自己做的\r\n\r\n- 把速度放稳，蛋白质吃够，加上力量练习 —— 这几件事同时也是保肌肉的做法。\r\n- **出门防晒、做好保湿**，睡眠补够。\r\n- 面部评估和干预，由皮肤科医生评估后决定；做与不做都不影响减重这件事本身。\r\n\r\n## 04 什么时候安排评估\r\n\r\n- 变化已经让你在意 —— 联系我们，安排评估。\r\n- 同时出现明显乏力、松弛影响到日常生活 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M05":"# M05 · 掉头发怎么处理\r\n\r\n\u003e 导语：这段时间掉发，多数是身体在适应，之后会慢慢回来。\r\n\r\n## 01 为什么会掉\r\n\r\n- 体重下降、吃得少的时候，身体会把营养先给重要器官，头发的生长周期被推后，于是出现集中脱落。\r\n- 这种掉发多是一过性的，体重稳定后会慢慢恢复。\r\n\r\n## 02 可以自己做的\r\n\r\n- **每餐先吃蛋白质**，不靠少吃换速度。\r\n- 复查时把铁、维生素、甲状腺这几项一起看，缺了按医生的方案补，不自己买。\r\n\r\n## 03 什么时候联系我们\r\n\r\n- 掉发多到明显能看到头皮 —— 联系我们。\r\n- 同时伴随乏力、月经变化 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M06":"# M06 · 情绪低落、想吃东西怎么处理\r\n\r\n\u003e 导语：吃得少了，情绪跟着起伏很常见，主要得分清是真饿还是压力。\r\n\r\n## 01 为什么会有这些变化\r\n\r\n- 食欲被压下来之后，吃东西带来的放松感变少，人会觉得空，容易烦躁或低落。\r\n- 吃得少、睡得差、血糖波动，也会把情绪一起往下带。\r\n\r\n## 02 又想吃，是不是药失效了\r\n\r\n- 不是。食欲会跟着压力、睡眠、经期、饭点安排上下浮动，某几天想吃多说明不了什么。\r\n- 判断方案有没有效果，看体重和指标的**周趋势**，不看某一天的食欲。\r\n\r\n## 03 可以自己先做的\r\n\r\n- **把三餐时间固定**，不把饿攒到晚上。\r\n- 想吃的时候先分清是真饿还是压力：起来走一会儿、喝口水、刷个牙、换个地方待着。\r\n- 睡眠先补回来，睡前不看体重数字。\r\n\r\n## 04 什么时候找人聊\r\n\r\n- 低落持续两周以上、对以前喜欢的事提不起兴趣 —— 联系我们，安排医生评估。\r\n- 失眠、明显焦虑，或这些变化影响到工作和进食 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","R01":"# R01 · 复查都看哪些指标\r\n\r\n\u003e 导语：复查不是再去称一次体重，是确认身体整体在往好的方向走。\r\n\r\n## 01 通常会查\r\n\r\n- **体重、腰围、体成分** —— 看掉的是不是该掉的那部分。\r\n- **空腹血糖、糖化血红蛋白** —— 看代谢有没有跟着改善。\r\n- **血脂、肝肾功能** —— 看身体有没有别的负担。\r\n- 这段时间的**反应记录** —— 一起带给医生。\r\n\r\n## 02 为什么不只看体重\r\n\r\n- 腰围降了、指标变好，体重没动也算有变化。\r\n- 体重掉了但指标没改善 —— 由医生判断要不要调整方案。\r\n\r\n## 03 报告怎么看\r\n\r\n- 报告出来由医生逐项解读，有疑问当场问清。\r\n- 下一次复查的时间，按医生排的来。\r\n\r\n## 04 去之前准备什么\r\n\r\n- 先问清这次要不要空腹、能不能喝水。\r\n- 带上这段时间的体重记录和反应记录。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","R02":"# R02 · 复查怎么准备\r\n\r\n\u003e 导语：线上交记录，到院按项目准备空腹和资料。\r\n\r\n## 01 出发前整理三样东西\r\n\r\n- **体重与腰围** —— 按时间排好，不要只报一个数。\r\n- **用药后的反应** —— 什么时候出现、现在还有没有。\r\n- **在吃的其他药和补充剂** —— 写清名字。\r\n\r\n## 02 线上复查\r\n\r\n- 按提示提交记录，有检查报告一并上传。\r\n- 想问的问题提前写成一条，别分成很多条发。\r\n- 结果在同一处查看，结论由医生给。\r\n\r\n## 03 到院复查\r\n\r\n- 先问清哪些项目要空腹，抽血前别吃早餐。\r\n- 带上正在用的药和以往的检查报告。\r\n- 最近在别处做过的检查 —— 带上报告，能不能免做由医生定。\r\n\r\n## 04 停不停针、查什么\r\n\r\n- 要不要停针、停多久 —— 按医生这次的嘱咐来。\r\n- 查哪些项目由医生按你的情况定，不是每次都一样。\r\n\r\n## 05 复查之后\r\n\r\n- 结论是维持 —— 按原方案继续。\r\n- 结论是调整 —— 按新方案走，不自己改剂量。\r\n- 结论是需要面诊 —— 按医生提示安排到院的时间。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","R03":"# R03 · 复查之后方案可能有哪几种变化\r\n\r\n\u003e 导语：维持、调整、需要面诊，三种结论各有各的下一步。\r\n\r\n## 01 结论一 维持\r\n\r\n- 剂量和节奏不变，按原方案继续。\r\n- 到下一个复查节点再评估。\r\n\r\n## 02 结论二 调整\r\n\r\n- **剂量调整** —— 由医生改，不自己加减，见「剂量是怎么一步步调的」。\r\n- **节奏调整** —— 复查间隔和检查项目可能跟着变。\r\n- 调整后的反应怎么应对 —— 见「用药后的反应怎么应对」。\r\n\r\n## 03 结论三 需要面诊或检查\r\n\r\n- 医生会说明是哪一项需要线下确认。\r\n- 准备事项见「复查怎么准备」。\r\n\r\n## 04 几个常被问的\r\n\r\n- **方案变了是不是更贵** —— 费用按服务口径算，问顾问，科普里不给数字。\r\n- **调整后要重新爬坡吗** —— 由医生说明，按新的节奏走。\r\n- **我可以不改吗** —— 把顾虑告诉医生，由医生判断，不自行维持原剂量。\r\n\r\n## 05 看方案之前先看指标\r\n\r\n- 复查重点看代谢指标，不只看体重，见「复查都看哪些指标」。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","S03":"# S03 · 漏打或晚打几天怎么办\r\n\r\n\u003e 导语：漏了一针不用慌，先看看说明书上补打的窗口是怎么写的。\r\n\r\n## 01 想起来的时候先看两个东西\r\n\r\n- 翻处方和药品说明书，看这一针的补打窗口怎么写的。\r\n- 离下一次还有余量 —— 按说明书补上。\r\n- 已经很接近下一次 —— 跳过这次，到日子正常打。\r\n\r\n## 02 补打的边界\r\n\r\n- **只打处方剂量** —— 不因为漏了就补成两份。\r\n- **下一次照原日子打** —— 不提前，也不往后推。\r\n- 不确定算不算\"接近\" —— 联系我们，由医生判定。\r\n\r\n## 03 连续漏打、或晚打的天数较多\r\n\r\n- 联系我们，按你的用药间隔重排日子。\r\n- 漏打这段时间照常吃饭喝水，不靠少吃把这一针\"省回来\"。\r\n\r\n## 04 之后尽量不再漏\r\n\r\n- 每周固定同一天，手机日历设一个提醒。\r\n- 出差前先把日期排好，确认住处有没有冷藏条件。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","S04":"# S04 · 哪些情况要马上联系医生\r\n\r\n\u003e 导语：有几类情况不能等，出现了就别拖，直接联系我们。\r\n\r\n## 01 吐、疼、胀到吃不下\r\n\r\n- 呕吐止不住，喝水也吐 —— 联系我们。\r\n- 肚子一直疼、越来越重 —— 联系我们。\r\n- 便秘、腹胀到难受 —— 联系我们。\r\n- 吃不下、喝不进，一直没好转 —— 联系我们。\r\n\r\n## 02 脱水与体力明显下降\r\n\r\n- 头晕，站起来眼前发黑、心慌 —— 联系我们。\r\n- 明显乏力、站不稳 —— 联系我们。\r\n- 尿变得很少、颜色很深 —— 联系我们。\r\n- 一直口干，皮肤按下去回弹慢 —— 联系我们。\r\n\r\n## 03 这几类不要等，直接就医\r\n\r\n- 剧烈腹痛，肚子按不得 —— 直接就医。\r\n- 意识不清、叫不太醒、抽搐 —— 直接就医。\r\n- 呼吸困难、嘴唇发紫 —— 直接就医。\r\n- 脸或嘴唇肿、喘不上气、全身大片皮疹 —— 直接就医。\r\n- 吐血、解黑便 —— 直接就医。\r\n- 说不清哪里不对，但就是觉得不对劲 —— 联系我们。\r\n\r\n## 04 用药出了岔子\r\n\r\n- 打错剂量、多打了 —— 联系我们，把时间和当时的做法说清楚。\r\n- 漏打、晚打 —— 联系我们。\r\n- 药放过久、怀疑失效 —— 联系我们。\r\n- 冷链到手时温度不对 —— 联系我们。\r\n\r\n## 05 情绪\r\n\r\n- 情绪一直低落，影响吃饭睡觉 —— 联系我们。\r\n- 出现伤害自己的想法 —— 直接就医。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","W01":"# W01 · 用药第一周，身体会有哪些反应\r\n\r\n\u003e 导语：刚打完的这一两周，身体还在适应期，会有哪些变化，一起了解一下。\r\n\r\n## 01 注射当天\r\n\r\n- 注射部位可能有**发红、发硬、轻痛**，一般几天内自行消退。\r\n- 有人当天会比平时**累一些**。\r\n- 部位的处理办法见「第一次注射怎么做」。\r\n\r\n## 02 头一两周比较常见的\r\n\r\n- **恶心、没胃口** — 空腹或吃得偏油时更明显。\r\n- **吃两口就饱、腹胀、嗳气** — 吃得快，或一次吃得多时更容易出现。\r\n- **排便改变** — 比平时少，或比平时多，都可能。\r\n- **乏力** — 饭量下来之后常见。\r\n\r\n## 03 多久会减轻\r\n\r\n- 多数在**一到两周内减轻**，之后留下的是稳定的饱腹感。\r\n- 每次调整剂量后可能再出现一轮，适应一段时间后会缓下来。\r\n- 反应强弱与减重快慢没有对应关系；判断有没有起效见「没明显反应，怎么判断药有没有起效」。\r\n- 反应重到影响吃饭、睡觉或上班 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W02":"# W02 · 用药后的反应怎么应对\r\n\r\n\u003e 导语：恶心、便秘、腹胀这些，多数能靠吃法和节奏调过来。\r\n\r\n## 01 恶心、没胃口\r\n\r\n- 一次少吃点，**有饱意就停**，过一会儿饿了再少量加。\r\n- 把油腻、重口、甜的**先减下来**，吃得舒服的放在前面。\r\n- 饭后**别马上躺下**，站一会儿或慢慢走几步。\r\n\r\n## 02 腹胀、嗳气、吃两口就撑\r\n\r\n- **放慢速度**，一口多嚼几下，一顿吃够 20 分钟。\r\n- 两餐之间**小口喝水**，吃饭时不灌，减少腹胀。\r\n- 饭后走动一会儿，别坐着不动。\r\n\r\n## 03 便秘\r\n\r\n- **每天吃够**蔬菜、全谷物和水果，别只吃蛋白质。\r\n- **多喝水**，每天的走动量加上去。\r\n\r\n## 04 腹泻\r\n\r\n- 暂时避开油腻、生冷和辛辣的，先吃好消化的。\r\n- 拉得频繁、伴发热或明显口渴无力 —— 联系我们。\r\n\r\n## 05 乏力\r\n\r\n- **每餐先吃蛋白质**（蛋、奶、鱼、瘦肉、豆制品），别只吃几口主食。\r\n- 一天分四到五次吃，不把饭攒到晚上一顿。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W03":"# W03 · 没明显反应，怎么判断药有没有起效\r\n\r\n\u003e 导语：一点反应都没有，不代表没在起作用。判断看的是趋势，不是身体的动静。\r\n\r\n## 01 反应和效果是两件事\r\n\r\n- 有人几乎没有反应，体重和腰围照样在往下走。\r\n- 有没有反应，看的是个人对药物的耐受，**不决定你减了多少**。\r\n\r\n## 02 效果看趋势\r\n\r\n- 同一台秤、同一时间的体重，**按周看走向**，不看某一天的数字。\r\n- 体重之外，腰围、衣服的松紧、爬楼和走路的感觉，同样算变化。\r\n- 多久算「有变化」见「效果怎么看，多久算有变化」。\r\n\r\n## 03 两周以上完全没动，怎么走\r\n\r\n- 把最近两周的体重记录和饮食发给我们，一起看有没有能改的地方。\r\n- 要不要改方案由医生判断，**不自行调整剂量**。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W04":"# W04 · 吃得少了，怎么保证营养\r\n\r\n\u003e 导语：吃不下的时候，先别管吃了多少，把蛋白质先吃进去。\r\n\r\n## 01 每餐的先后顺序\r\n\r\n- **先吃蛋白质**：蛋、奶、鱼、虾、瘦肉、豆制品。\r\n- 再吃蔬菜，最后吃主食。\r\n- 吃得下多少先不管，**先把蛋白质吃进去**。\r\n\r\n## 配图（第 01 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：三格都吃不下时，保住第一格。示意图，不替代你的饮食方案。\r\n\r\n## 02 一天分成几顿\r\n\r\n- 一顿吃不下就不硬吃，分成**四到五次**，每次少一点。\r\n- 晚上不补白天欠的量，一次吃太多更容易胀、更容易吐。\r\n\r\n## 03 喝水和补剂\r\n\r\n- **主动喝**，不渴也喝，小口分次；恶心时慢一点。\r\n- 维生素、蛋白粉要不要补、补多少，按复查结果**由医生定**。\r\n\r\n## 04 吃不下的时候\r\n\r\n- 吃不下固体，先用奶、豆浆、蒸蛋、酸奶顶一顶。\r\n- 连续几天吃不下、体重掉得明显 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W05":"# W05 · 体重多久称一次、怎么记\r\n\r\n\u003e 导语：体重每天上下浮动很正常，盯单日数字容易白紧张。\r\n\r\n## 01 什么时候称\r\n\r\n- 每周**固定一天**的早上，起床后、上完厕所、饭前称。\r\n- **用同一台秤**，放在同一个位置，穿厚薄差不多的衣服。\r\n\r\n## 02 怎么记\r\n\r\n- 只记数字，一次一条。\r\n- **把一周的数字取平均**，看平均值的变化。\r\n\r\n## 03 数字怎么读\r\n\r\n- 单日上下浮动是正常的，不因为某天涨了就去少吃或调剂量。\r\n- 连续几周平均值不动，按「平台期怎么判断」排查，再由医生决定要不要调整。\r\n\r\n## 配图（第 03 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：看那条深色的周均值线，不看某一个点。示意图，不代表你的下降速度。\r\n\r\n## 04 体重之外还记什么\r\n\r\n- 每周同一天量一次**腰围**，位置固定在肚脐水平。\r\n- 恶心、便秘、乏力这些反应也记一句，复查时一起给医生。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W06":"# W06 · 减重期间喝酒怎么处理\r\n\r\n\u003e 导语：能不喝就不喝。\r\n\r\n## 01 尽量不喝\r\n\r\n- 酒精会让食欲控制变难，热量不低，还可能加重恶心和胃部不适。\r\n- 空腹时反应更明显。\r\n- 经常喝，等于把好不容易省下来的热量又喝回去。\r\n\r\n## 02 避不开的场合\r\n\r\n- **先吃点东西**再举杯，选低度，量压到最小。\r\n- 当天的注射照常，注射时间不用跟着吃饭时间改。\r\n- 当天**多喝水、吃够蛋白质**。\r\n\r\n## 03 喝完当天怎么处理\r\n\r\n- **多喝水**，降低身体酒精浓度。\r\n- 睡前不再加餐。\r\n- 出现明显恶心、呕吐 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n\r\n---\r\n\r\n## 用药中期（5–12 周）\r\n"};

\n  color:var(--zz-blue-3);letter-spacing:.6px}\r\n.sec-t{font-size:var(--fs-4);font-weight:700;line-height:1.5;color:var(--zz-blue-3)}\r\n\r\n/* ---------- 清单条目 ---------- */\r\n.ck{list-style:none}\r\n.ck li{position:relative;padding-left:18px;font-size:var(--fs-3);color:var(--ink);\r\n  line-height:1.85;margin-bottom:7px}\r\n.ck li:last-child{margin-bottom:0}\r\n.ck li::before{content:\"\";position:absolute;left:2px;top:10px;width:5px;height:5px;\r\n  border-radius:50%;background:var(--zz-blue-3)}\r\n.ck li b{font-weight:700}\r\n\r\n/* ---------- 名称 + 说明 ---------- */\r\n.item + .item{margin-top:var(--sp-1)}\r\n.item .nm{font-size:var(--fs-3);font-weight:700;color:var(--ink)}\r\n.item .ds{font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n\r\n/* ---------- 步骤 ---------- */\r\n.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}\r\n.step:first-child{padding-top:0}\r\n.step:last-child{border-bottom:0;padding-bottom:0}\r\n.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;\r\n  font-family:\"ZZ-Myriad\",var(--font);font-size:12px;font-weight:700;line-height:26px;text-align:center}\r\n.step .c{flex:1;min-width:0}\r\n.step .t{font-size:var(--fs-3);font-weight:700;color:var(--ink)}\r\n.step .d{font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n.step .d em{font-style:normal;font-weight:700;color:var(--accent-deep)}\r\n\r\n/* ---------- 部位 / 并列项 ---------- */\r\n.zone{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}\r\n.zone .dot{flex:0 0 5px;height:5px;border-radius:50%;background:var(--zz-blue-3);margin-top:11px}\r\n.zone .zc{flex:1;font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n.zone .zc b{font-weight:700;color:var(--ink)}\r\n\r\n/* ---------- 浅蓝提示块 ---------- */\r\n.no{background:var(--accent-soft);border-radius:var(--r-xs);padding:var(--sp-1);\r\n  font-size:var(--fs-2);color:var(--accent-deep);line-height:1.8;margin-top:var(--sp-1)}\r\n.no b{font-weight:700}\r\n\r\n/* ---------- 插图 ---------- */\r\n.fig{margin-top:var(--sp-1);background:#FBFDFE;border:1px solid var(--line);\r\n  border-radius:var(--r-xs);padding:12px 12px 10px;text-align:center}\r\n.fig__tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;\r\n  color:var(--accent-deep);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-bottom:8px}\r\n.fig img,.fig svg{display:block;width:100%;height:auto;max-height:250px;margin:0 auto}\r\n.fig__cap{font-size:var(--fs-1);color:var(--ink-3);line-height:1.65;margin-top:8px;text-align:left}\r\n\r\n/* ---------- 占位图（未出图时的过渡形态） ---------- */\r\n.ph{background:#FBFDFE;border:1.5px dashed #B9D3DA;border-radius:var(--r-xs);\r\n  padding:var(--sp-2);text-align:center;margin-top:var(--sp-1);color:var(--ink-3)}\r\n.ph .pht{font-size:var(--fs-2);font-weight:700;color:var(--ink-2)}\r\n.ph .pht .pn{color:var(--accent-deep)}\r\n.ph .phd{font-size:var(--fs-1);line-height:1.8;text-align:left;background:var(--card);\r\n  border-radius:8px;padding:8px 12px;margin-top:10px}\r\n.figure{background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r-xs);\r\n  padding:12px;text-align:center;margin-top:var(--sp-1);position:relative}\r\n.figure .fb{position:absolute;top:10px;right:12px;font-size:10px;color:var(--ink-3);\r\n  border:1px dashed #B9D3DA;border-radius:4px;padding:1px 7px}\r\n.figure svg{max-width:100%;height:auto}\r\n.fig-cap{font-size:var(--fs-1);color:var(--ink-3);line-height:1.65;margin-top:8px}\r\n\r\n/* ---------- 吸底 AI 按钮 ---------- */\r\n.askbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;\r\n  max-width:420px;z-index:6;padding:10px 18px calc(10px + env(safe-area-inset-bottom));\r\n  background:rgba(246,246,246,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}\r\n@media (min-width:480px){.askbar{bottom:24px;border-radius:0 0 32px 32px}}\r\n.page{padding-bottom:calc(92px + env(safe-area-inset-bottom))}\r\n.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;cursor:pointer;\r\n  font-family:var(--font);color:#fff;border:none;border-radius:14px;padding:13px;\r\n  font-size:var(--fs-3);font-weight:700;letter-spacing:.3px;\r\n  background:linear-gradient(135deg,var(--zz-blue-3) 0%,var(--zz-blue-2) 55%,var(--zz-blue-1) 100%);\r\n  box-shadow:0 8px 20px rgba(0,111,138,.22);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}\r\n.btn:active{transform:scale(.985);box-shadow:0 4px 10px rgba(0,111,138,.16)}\r\n\r\n/* ---------- 审核与说明卡（三件套） ---------- */\r\n.info{padding:var(--sp-2)}\r\n.ar__rv{display:flex;align-items:center;gap:8px;font-size:var(--fs-1);color:var(--accent-deep);\r\n  background:var(--accent-soft);border-radius:var(--r-xs);padding:8px var(--sp-1);line-height:1.6}\r\n.ar__rv-i{flex-shrink:0;background:var(--accent);color:#fff;border-radius:4px;\r\n  padding:2px 6px;font-size:10px;letter-spacing:.5px}\r\n.disclaim{font-size:var(--fs-1);color:var(--ink-3);line-height:1.8;margin-top:var(--sp-1)}\r\n\r\n/* ---------- 索引页 ---------- */\r\n.tip{background:var(--accent-soft);border-radius:var(--r-xs);padding:var(--sp-1);\r\n  font-size:var(--fs-2);color:var(--accent-deep);line-height:1.8}\r\n.tip + .tip{margin-top:var(--sp-1)}\r\n.tip b{font-weight:700}\r\n.lst{list-style:none}\r\n.lst li + li{border-top:1px solid var(--line-soft)}\r\n.lst a{display:flex;align-items:baseline;gap:10px;padding:13px 0;min-height:48px;\r\n  text-decoration:none;color:var(--ink)}\r\n.lst .id{flex:0 0 32px;font-family:\"ZZ-Myriad\",var(--font);font-size:var(--fs-1);\r\n  font-weight:700;color:var(--zz-blue-3)}\r\n.lst .t{flex:1;min-width:0;font-size:var(--fs-3);line-height:1.5}\r\n@media (hover:hover){.lst a:hover .t{color:var(--accent-deep)}}\r\n@media (max-width:360px){.page{padding-left:14px;padding-right:14px}}\r\n\r\n/* ===== 版头 P4（定稿）：眉标 + 左对齐深墨标题，页面底色，无装饰 ===== */\r\n.topbar{background:var(--bg);position:relative;z-index:2}\r\n.topbar__back{width:36px;height:36px ar(--accent-soft);color:var(--zz-blue-1);font-size:10.5px;\r\n  letter-spacing:.4px}\r\n.sec-t{font-size:var(--fs-4);line-height:1.45}\r\n.ck li::before{width:5px;height:5px;border-radius:1px;top:9px;left:3px;\r\n  background:var(--zz-blue-3);transform:rotate(45deg)}\r\n.ck li{padding-left:19px}\r\n.item .nm{display:flex;align-items:center;gap:7px}\r\n.item .nm::before{content:\"\";flex:0 0 5px;height:5px;border-radius:1px;\r\n  background:var(--zz-blue-3);transform:rotate(45deg)}\r\n.item + .item{margin-top:14px;padding-top:14px;border-top:1px dashed #F0EFEE}\r\n.ar__ask{border-color:rgba(0,111,138,.14)}\r\n.info .disclaim{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:12px}\r\n/* ---------- 配图容器：图位 + 示意标注 + 图注 ---------- */\r\n.fig__area{display:block;width:100%;aspect-ratio:16 / 9;background:#F7FBFD;\r\n  border:1px dashed #CFE0E6;border-radius:8px}\r\n.fig img,.fig svg{max-height:240px}\r\n\r\n/* ---------- 表格（2–3 列，手机不横向滚动） ---------- */\r\n.tbl{margin-top:var(--sp-1);border:1px solid var(--line);border-radius:var(--r-xs);\r\n  overflow:hidden;background:var(--card)}\r\n.tbl table{width:100%;border-collapse:collapse;table-layout:fixed}\r\n.tbl caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\r\n.tbl th,.tbl td{padding:10px 12px;text-align:left;font-size:var(--fs-2);line-height:1.6;\r\n  border-bottom:1px solid var(--line-soft);vertical-align:top;word-break:break-word}\r\n.tbl thead th{background:var(--accent-soft);color:var(--zz-blue-1);font-size:var(--fs-1);\r\n  font-weight:700;letter-spacing:.3px;border-bottom-color:rgba(0,111,138,.12)}\r\n.tbl tbody th{width:38%;font-weight:700;color:var(--ink)}\r\n.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}\r\n.tbl .num{font-family:\"ZZ-Myriad\",var(--font);font-weight:700;color:var(--zz-blue-1);\r\n  text-align:center}\r\n.tbl__note{font-size:var(--fs-1);color:var(--ink-3);line-height:1.7;margin-top:8px}\r\n\r\n@media (max-width:360px){\r\n /* ===================== 单页 md → 页面 HTML ===================== */
function parsePage(md) {
  const out = { id:'', title:'', lead:'', rev:'', secs:[] };
  let cur = null;
  const figBox = { n:null, note:'' };
  for (const raw of md.split(/\r?\n/)) {
    const l = raw.trim();
    let m;
    if ((m = l.match(/^#\s+([A-Z]\d\d)\s*·\s*(.+)$/))) { out.id = m[1]; out.title = m[2].trim(); continue; }
    if (/^>\s*导语：/.test(l)) { out.lead = l.replace(/^>\s*导语：/,'').trim(); continue; }
    if (/^>/.test(l)) { out.rev = l.replace(/^>\s*/,'').trim(); continue; }
    if ((m = l.match(/^##\s*配图\s*[（(]第\s*(\d+)\s*节[）)]/))) { figBox.n = m[1]; continue; }
    if (/^##\s*配图/.test(l)) { figBox.n = '0'; continue; }
    if ((m = l.match(/^##\s+(\d+)\s+(.+)$/))) { cur = { n:m[1], t:m[2].trim(), items:[] }; out.secs.push(cur); continue; }
    if (/^- 图注：/.test(l)) { figBox.note = l.replace(/^- 图注：/,'').trim(); continue; }
    if (/^- 画什么：/.test(l)) { continue; }
    if (/^- /.test(l) && cur) {
      const txt = l.replace(/^- /,'').trim();
      const it = txt.match(/^\*\*(.+?)\*\*\s+—\s+(.+)$/);
      cur.items.push(it ? { kind:'item', nm:it[1], ds:it[2] } : { kind:'li', txt });
    }
  }
  if (figBox.note && out.secs.length) {
    const host = out.secs.find(s => s.n === figBox.n) || out.secs[out.secs.length - 1];
    host.fig = figBox.note;
  }
  return out;
}

/* ===================== 保存 / 发布 ===================== */
async function saveOne(a) {
  if (!ONLINE) {                          // 只读：导出这一页的 md
    downloadMd(a.md.split('/').pop(), DOCS[a.id]);
    return null;
  }
  const j = await getJson('api/md?file=' + encodeURIComponent(a.md), { method:'POST', body: DOCS[a.id] });
  if (!j || !j.ok) throw new Error('保存失败：' + a.md + '（本机服务没在跑？先双击 start-editor.bat 再打开本页）');
  delete DIRTY[a.id];
  markDirty(false);
}
async function regenOne(a) {
  if (!ONLINE) throw new Error('回灌需要本机服务：先双击 start-editor.bat');
  const j = await getJson('api/page?file=' + encodeURIComponent(a.html), { method:'POST', body: pageHtml(parsePage(DOCS[a.id]), a.id) });
  if (!j || !j.ok) throw new Error('回灌失败：' + a.html);
}

$('#md').addEventListener('input', () => {
  DOCS[CUR] = $('#md').value;
  markDirty(true);
  clearTimeout(window.__t); window.__t = setTimeout(render, 250);
});
$('#artSel').addEventListener('change', () => { show($('#artSel').value); });

$('#btnSave').addEventListener('click', async () => {
  const b = $('#btnSave'); b.disabled = true; say('处理中…');
  try {
    const a = ARTICLES.find(x => x.id === CUR);
    await saveOne(a);
    if (ONLINE) { say('保存成功', 'ok'); }
    else {
      const name = a.md.split('/').pop();
      const copied = await copyText(DOCS[a.id]);
      say('保存成功：文件已存到「下载」目录（' + name + '）。\n' +
          (copied ? '全文也已经复制好，直接在微信里粘贴发给我就行。' : '把这个文件发给我就行。'), 'ok');
    }
  } catch (e) { say(ONLINE ? '保存失败，请确认 start-editor.bat 的黑窗口还开着。' : '保存失败，再点一次试试；不行就把右边的文字复制出来发我。', 'err'); }
  b.disabled = false;
});

$('#btnSaveAll').addEventListener('click', async () => {
  const b = $('#btnSaveAll'); b.disabled = true;
  try {
    if (ONLINE) {
      say('保存全部…');
      for (const a of ARTICLES) await saveOne(a);
      say('保存成功', 'ok');
    } else {
      const n = zipAll();
      say('保存成功：' + n + ' 篇已打包成 zip（在「下载」目录），把这个压缩包发给我就行。', 'ok');
    }
  } catch (e) { say(ONLINE ? '保存失败，请确认 start-editor.bat 的黑窗口还开着。' : '打包失败，再点一次试试。', 'err'); }
  b.disabled = false;
});

$('#btnPub').addEventListener('click', async () => {
  const b = $('#btnPub');
  if (!ONLINE) return;
  if (!confirm('定稿：保存全部文案 → 回灌全部页面 → 提交并推送到 GitHub？')) return;
  b.disabled = true;
  try {
    say('正在保存并回灌页面…');
    for (const a of ARTICLES) await saveOne(a);
    for (const a of ARTICLES) await regenOne(a);

    say('正在推送到 GitHub…');
    const j = await getJson('api/publish', { method:'POST', body: JSON.stringify({ msg: $('#cmtMsg').value || '医学编辑定稿' }) });
    if (!j) { say('发布失败：请确认 start-editor.bat 的黑窗口还开着。', 'err'); }
    else if (j.ok) { console.log(j.log); say('发布成功', 'ok'); }
    else { console.log(j.log); say('已保存到本机，但推送到 GitHub 失败（改动都在，稍后再点一次或找产品侧）。', 'err'); }
  } catch (e) { say('发布失败，请确认 start-editor.bat 的黑窗口还开着。', 'err'); }
  b.disabled = false;
});

(async function init() {
  try {
    await loadHead();
    await loadMeta();
    // 探测本机服务：有 → 能保存 / 回灌 / 发布；没有 → 只读，导出 md
    const probe = await getJson('api/status');
    ONLINE = !!(probe && probe.repo !== undefined);
    await loadDocs();
    await loadFigs();
    fillSelect();
    // 支持 index.html 直接跳到某一篇：editor.html?id=S04
    const want = new URLSearchParams(location.search).get('id');
    const hit = want && ARTICLES.some(a => a.id === want) ? want : ARTICLES[0].id;
    show(hit);
    setMode();
    if (!ONLINE) {
      say('改完点右上角的「保存本页」：文件会自动存到「下载」目录，全文也复制好了，直接粘贴发给我就行。\n' +
          '一次改了很多篇，就点「保存全部（打包下载）」，发我一个压缩包。');
      return;
    }
    say('就绪 · 共 ' + ARTICLES.length + ' 篇 · 改完点「保存本页」就行');
  } catch (e) { say('初始化失败：' + e.message, 'err'); }
})();
</script>
</body>
