const DOCS = {"E01":"# E01 · 什么时候可以停药\r\n\r\n\u003e 导语：停药由医生综合判断，不看某一个数字到没到。\r\n\r\n## 01 医生会综合这几件事\r\n\r\n- **体重与腰围** —— 有没有达到目标，并且稳得住。\r\n- **代谢指标** —— 血糖、血脂有没有跟着改善。\r\n- **吃饭和运动习惯** —— 是不是已经稳定成型。\r\n- **停药后的反弹风险** —— 因人而异，由医生估。\r\n\r\n## 02 去复查前整理好\r\n\r\n- 把体重、腰围、反应记录按时间整理好，带过去。\r\n- 想停药的理由说清楚 —— 医生据此判断是减、维持还是换方案。\r\n\r\n## 03 不能自己决定的部分\r\n\r\n- **停药与减量由医生定** —— 常见的做法是逐步减，不是直接停。\r\n- 体重到了目标不等于可以停 —— 看的是整体，不是单个数字。\r\n\r\n## 04 停药之后\r\n\r\n- 维持期的节奏见「停药之后怎么维持住」。\r\n- 之后多久复查一次，按医生复查时说的来。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","E02":"# E02 · 停药之后怎么维持住\r\n\r\n\u003e 导语：停药不是结束，这段时间怎么过，决定体重怎么回来。\r\n\r\n## 01 三件要坚持的事\r\n\r\n- **吃够蛋白质、保住肌肉** —— 基础代谢靠肌肉托着。\r\n- **每周做两三次力量训练** —— 维持期的体重也靠它。\r\n- **继续记体重** —— 有变化能早点发现。\r\n\r\n## 02 数字怎么读\r\n\r\n- 小范围上下浮动是正常的，不因为某天涨了就少吃。\r\n- 连续几周单向上涨 —— 联系我们，别等到明显反弹。\r\n\r\n## 03 复查与求助\r\n\r\n- 复查按医生排的节奏走，重点看代谢指标。\r\n- 吃的东西又开始控制不住 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","M01":"# M01 · 剂量是怎么一步步调的\r\n\r\n\u003e 导语：剂量是慢慢往上走的，不是一次到位。每一档停多久、由谁决定调，一起了解一下。\r\n\r\n## 01 为什么从小剂量开始\r\n\r\n- 让身体先适应，把恶心、腹胀这类反应**控制在**不影响吃饭和上班的程度。\r\n- 一上来就用大剂量，反应更重，更容易中断，对坚持下来没有好处。\r\n\r\n## 02 每一档怎么往上走\r\n\r\n- 每一档都有一段观察期，**多久、下一档多少，以你的处方为准**。\r\n- 往上调之前看三样：反应能不能耐受、体重和腰围的周趋势、复查指标。\r\n\r\n## 配图（第 02 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：每一档停多久、下一档多少，按你的处方来。示意图，不代表具体剂量。\r\n\r\n## 03 调完之后会有什么\r\n\r\n- 适应期的反应可能再出现一轮，一般比第一次轻。应对办法见「用药后的反应怎么应对」。\r\n- 反应没加重，不代表剂量不够；反应重，也不代表效果好。\r\n\r\n## 04 调不调谁说了算\r\n\r\n- 由医生按复查结果决定，**不自行调整剂量，也不提前调**。\r\n- 想加快、想停在这一档、想回到上一档，把想法告诉医生，由医生判断。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M02":"# M02 · 平台期怎么判断\r\n\r\n\u003e 导语：连着两周体重不动，先别急着加量，多数时候问题出在别处。\r\n\r\n## 01 先确认是不是平台期\r\n\r\n- 连着**两周以上的周均值基本不动**，才算平台期。\r\n- 单周停一下是正常的，先不用当回事。\r\n\r\n## 配图（第 01 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：连着两周以上走平，才算平台期。示意图，不代表之后会怎么走。\r\n\r\n## 02 先排查这四件事\r\n\r\n- 记三天饮食，看是不是不知不觉吃回来了。\r\n- 看蛋白质够不够、力量练习有没有落下。\r\n- 看睡眠和情绪，这两项会直接拖慢进度。\r\n- 看有没有漏打，注射的日子有没有来回漂。\r\n\r\n## 03 平台期本身要处理吗\r\n\r\n- 它是身体适应了当前节奏的现象，几乎每个人都会遇到，不等于方案失效。\r\n- 会持续多久没有固定答案，因人而异。\r\n\r\n## 04 接下来怎么走\r\n\r\n- 把上面四项的结果和体重记录一起交给医生，由医生判断要不要调方案。\r\n- 按上面四项调整两三周还是不动 —— 联系我们。\r\n- **不自行调整剂量，也不自行换药**。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M03":"# M03 · 掉得太快怎么处理\r\n\r\n\u003e 导语：掉得快不全是好事，水分和肌肉可能一起走。\r\n\r\n## 01 速度不等于成绩\r\n\r\n- 掉得急的阶段，减掉的水分和肌肉占的比例更高，体重看着漂亮，身体不一定更好。\r\n- 我们看的是**周均值往下的趋势**，不是某一周掉了多少。\r\n\r\n## 02 掉太快会出现什么\r\n\r\n- 乏力、头晕，蹲下再站起来眼前发黑。\r\n- 力量下降，爬楼、拎东西比以前吃力。\r\n- 脸色差、面部线条塌下来、掉头发，见「减重期间的面部与皮肤变化」「掉头发怎么处理」。\r\n\r\n## 03 把速度放稳的做法\r\n\r\n- **每餐先吃蛋白质**，饭量别再往下压。\r\n- 每周安排力量练习，别只做走路和跑步。\r\n- 吃不下的时候，从吃法上想办法，不用「再少吃一点」换速度。\r\n\r\n## 04 什么时候联系医生\r\n\r\n- 下降明显快于前几周的节奏 —— 联系我们，由医生判断要不要调方案。\r\n- 已经出现乏力、头晕并影响到工作和生活 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M04":"# M04 · 减重期间的面部与皮肤变化\r\n\r\n\u003e 导语：瘦得快的时候，脸会比身材先显出来，应对方案也很成熟。\r\n\r\n## 01 为什么会松\r\n\r\n- 体重下来时，面部的皮下脂肪先减少，皮肤和支撑组织回缩的速度跟不上，于是出现凹陷、法令纹变深、看上去疲惫。\r\n- 网上说的「司美脸」讲的就是这个现象：**快速减重之后都可能出现**，不是某一支药独有的。\r\n\r\n## 02 什么时候更明显\r\n\r\n- 下降快的那段时间，以及原本面部就比较瘦的人，更明显。\r\n- 抽烟、日晒、熬夜会拖慢皮肤回弹。\r\n\r\n## 03 可以自己做的\r\n\r\n- 把速度放稳，蛋白质吃够，加上力量练习 —— 这几件事同时也是保肌肉的做法。\r\n- **出门防晒、做好保湿**，睡眠补够。\r\n- 面部评估和干预，由皮肤科医生评估后决定；做与不做都不影响减重这件事本身。\r\n\r\n## 04 什么时候安排评估\r\n\r\n- 变化已经让你在意 —— 联系我们，安排评估。\r\n- 同时出现明显乏力、松弛影响到日常生活 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M05":"# M05 · 掉头发怎么处理\r\n\r\n\u003e 导语：这段时间掉发，多数是身体在适应，之后会慢慢回来。\r\n\r\n## 01 为什么会掉\r\n\r\n- 体重下降、吃得少的时候，身体会把营养先给重要器官，头发的生长周期被推后，于是出现集中脱落。\r\n- 这种掉发多是一过性的，体重稳定后会慢慢恢复。\r\n\r\n## 02 可以自己做的\r\n\r\n- **每餐先吃蛋白质**，不靠少吃换速度。\r\n- 复查时把铁、维生素、甲状腺这几项一起看，缺了按医生的方案补，不自己买。\r\n\r\n## 03 什么时候联系我们\r\n\r\n- 掉发多到明显能看到头皮 —— 联系我们。\r\n- 同时伴随乏力、月经变化 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","M06":"# M06 · 情绪低落、想吃东西怎么处理\r\n\r\n\u003e 导语：吃得少了，情绪跟着起伏很常见，主要得分清是真饿还是压力。\r\n\r\n## 01 为什么会有这些变化\r\n\r\n- 食欲被压下来之后，吃东西带来的放松感变少，人会觉得空，容易烦躁或低落。\r\n- 吃得少、睡得差、血糖波动，也会把情绪一起往下带。\r\n\r\n## 02 又想吃，是不是药失效了\r\n\r\n- 不是。食欲会跟着压力、睡眠、经期、饭点安排上下浮动，某几天想吃多说明不了什么。\r\n- 判断方案有没有效果，看体重和指标的**周趋势**，不看某一天的食欲。\r\n\r\n## 03 可以自己先做的\r\n\r\n- **把三餐时间固定**，不把饿攒到晚上。\r\n- 想吃的时候先分清是真饿还是压力：起来走一会儿、喝口水、刷个牙、换个地方待着。\r\n- 睡眠先补回来，睡前不看体重数字。\r\n\r\n## 04 什么时候找人聊\r\n\r\n- 低落持续两周以上、对以前喜欢的事提不起兴趣 —— 联系我们，安排医生评估。\r\n- 失眠、明显焦虑，或这些变化影响到工作和进食 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","R01":"# R01 · 复查都看哪些指标\r\n\r\n\u003e 导语：复查不是再去称一次体重，是确认身体整体在往好的方向走。\r\n\r\n## 01 通常会查\r\n\r\n- **体重、腰围、体成分** —— 看掉的是不是该掉的那部分。\r\n- **空腹血糖、糖化血红蛋白** —— 看代谢有没有跟着改善。\r\n- **血脂、肝肾功能** —— 看身体有没有别的负担。\r\n- 这段时间的**反应记录** —— 一起带给医生。\r\n\r\n## 02 为什么不只看体重\r\n\r\n- 腰围降了、指标变好，体重没动也算有变化。\r\n- 体重掉了但指标没改善 —— 由医生判断要不要调整方案。\r\n\r\n## 03 报告怎么看\r\n\r\n- 报告出来由医生逐项解读，有疑问当场问清。\r\n- 下一次复查的时间，按医生排的来。\r\n\r\n## 04 去之前准备什么\r\n\r\n- 先问清这次要不要空腹、能不能喝水。\r\n- 带上这段时间的体重记录和反应记录。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","S03":"# S03 · 漏打或晚打几天怎么办\r\n\r\n\u003e 导语：漏了一针不用慌，先看看说明书上补打的窗口是怎么写的。\r\n\r\n## 01 想起来的时候先看两个东西\r\n\r\n- 翻处方和药品说明书，看这一针的补打窗口怎么写的。\r\n- 离下一次还有余量 —— 按说明书补上。\r\n- 已经很接近下一次 —— 跳过这次，到日子正常打。\r\n\r\n## 02 补打的边界\r\n\r\n- **只打处方剂量** —— 不因为漏了就补成两份。\r\n- **下一次照原日子打** —— 不提前，也不往后推。\r\n- 不确定算不算\"接近\" —— 联系我们，由医生判定。\r\n\r\n## 03 连续漏打、或晚打的天数较多\r\n\r\n- 联系我们，按你的用药间隔重排日子。\r\n- 漏打这段时间照常吃饭喝水，不靠少吃把这一针\"省回来\"。\r\n\r\n## 04 之后尽量不再漏\r\n\r\n- 每周固定同一天，手机日历设一个提醒。\r\n- 出差前先把日期排好，确认住处有没有冷藏条件。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","S04":"# S04 · 哪些情况要马上联系医生\r\n\r\n\u003e 导语：有几类情况不能等，出现了就别拖，直接联系我们。\r\n\r\n## 01 吐、疼、胀到吃不下\r\n\r\n- 呕吐止不住，喝水也吐 —— 联系我们。\r\n- 肚子一直疼、越来越重 —— 联系我们。\r\n- 便秘、腹胀到难受 —— 联系我们。\r\n- 吃不下、喝不进，一直没好转 —— 联系我们。\r\n\r\n## 02 脱水与体力明显下降\r\n\r\n- 头晕，站起来眼前发黑、心慌 —— 联系我们。\r\n- 明显乏力、站不稳 —— 联系我们。\r\n- 尿变得很少、颜色很深 —— 联系我们。\r\n- 一直口干，皮肤按下去回弹慢 —— 联系我们。\r\n\r\n## 03 这几类不要等，直接就医\r\n\r\n- 剧烈腹痛，肚子按不得 —— 直接就医。\r\n- 意识不清、叫不太醒、抽搐 —— 直接就医。\r\n- 呼吸困难、嘴唇发紫 —— 直接就医。\r\n- 脸或嘴唇肿、喘不上气、全身大片皮疹 —— 直接就医。\r\n- 吐血、解黑便 —— 直接就医。\r\n- 说不清哪里不对，但就是觉得不对劲 —— 联系我们。\r\n\r\n## 04 用药出了岔子\r\n\r\n- 打错剂量、多打了 —— 联系我们，把时间和当时的做法说清楚。\r\n- 漏打、晚打 —— 联系我们。\r\n- 药放过久、怀疑失效 —— 联系我们。\r\n- 冷链到手时温度不对 —— 联系我们。\r\n\r\n## 05 情绪\r\n\r\n- 情绪一直低落，影响吃饭睡觉 —— 联系我们。\r\n- 出现伤害自己的想法 —— 直接就医。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.15\r\n","W01":"# W01 · 用药第一周，身体会有哪些反应\r\n\r\n\u003e 导语：刚打完的这一两周，身体还在适应期，会有哪些变化，一起了解一下。\r\n\r\n## 01 注射当天\r\n\r\n- 注射部位可能有**发红、发硬、轻痛**，一般几天内自行消退。\r\n- 有人当天会比平时**累一些**。\r\n- 部位的处理办法见「第一次注射怎么做」。\r\n\r\n## 02 头一两周比较常见的\r\n\r\n- **恶心、没胃口** — 空腹或吃得偏油时更明显。\r\n- **吃两口就饱、腹胀、嗳气** — 吃得快，或一次吃得多时更容易出现。\r\n- **排便改变** — 比平时少，或比平时多，都可能。\r\n- **乏力** — 饭量下来之后常见。\r\n\r\n## 03 多久会减轻\r\n\r\n- 多数在**一到两周内减轻**，之后留下的是稳定的饱腹感。\r\n- 每次调整剂量后可能再出现一轮，适应一段时间后会缓下来。\r\n- 反应强弱与减重快慢没有对应关系；判断有没有起效见「没明显反应，怎么判断药有没有起效」。\r\n- 反应重到影响吃饭、睡觉或上班 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W02":"# W02 · 用药后的反应怎么应对\r\n\r\n\u003e 导语：恶心、便秘、腹胀这些，多数能靠吃法和节奏调过来。\r\n\r\n## 01 恶心、没胃口\r\n\r\n- 一次少吃点，**有饱意就停**，过一会儿饿了再少量加。\r\n- 把油腻、重口、甜的**先减下来**，吃得舒服的放在前面。\r\n- 饭后**别马上躺下**，站一会儿或慢慢走几步。\r\n\r\n## 02 腹胀、嗳气、吃两口就撑\r\n\r\n- **放慢速度**，一口多嚼几下，一顿吃够 20 分钟。\r\n- 两餐之间**小口喝水**，吃饭时不灌，减少腹胀。\r\n- 饭后走动一会儿，别坐着不动。\r\n\r\n## 03 便秘\r\n\r\n- **每天吃够**蔬菜、全谷物和水果，别只吃蛋白质。\r\n- **多喝水**，每天的走动量加上去。\r\n\r\n## 04 腹泻\r\n\r\n- 暂时避开油腻、生冷和辛辣的，先吃好消化的。\r\n- 拉得频繁、伴发热或明显口渴无力 —— 联系我们。\r\n\r\n## 05 乏力\r\n\r\n- **每餐先吃蛋白质**（蛋、奶、鱼、瘦肉、豆制品），别只吃几口主食。\r\n- 一天分四到五次吃，不把饭攒到晚上一顿。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W03":"# W03 · 没明显反应，怎么判断药有没有起效\r\n\r\n\u003e 导语：一点反应都没有，不代表没在起作用。判断看的是趋势，不是身体的动静。\r\n\r\n## 01 反应和效果是两件事\r\n\r\n- 有人几乎没有反应，体重和腰围照样在往下走。\r\n- 有没有反应，看的是个人对药物的耐受，**不决定你减了多少**。\r\n\r\n## 02 效果看趋势\r\n\r\n- 同一台秤、同一时间的体重，**按周看走向**，不看某一天的数字。\r\n- 体重之外，腰围、衣服的松紧、爬楼和走路的感觉，同样算变化。\r\n- 多久算「有变化」见「效果怎么看，多久算有变化」。\r\n\r\n## 03 两周以上完全没动，怎么走\r\n\r\n- 把最近两周的体重记录和饮食发给我们，一起看有没有能改的地方。\r\n- 要不要改方案由医生判断，**不自行调整剂量**。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W04":"# W04 · 吃得少了，怎么保证营养\r\n\r\n\u003e 导语：吃不下的时候，先别管吃了多少，把蛋白质先吃进去。\r\n\r\n## 01 每餐的先后顺序\r\n\r\n- **先吃蛋白质**：蛋、奶、鱼、虾、瘦肉、豆制品。\r\n- 再吃蔬菜，最后吃主食。\r\n- 吃得下多少先不管，**先把蛋白质吃进去**。\r\n\r\n## 配图（第 01 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：三格都吃不下时，保住第一格。示意图，不替代你的饮食方案。\r\n\r\n## 02 一天分成几顿\r\n\r\n- 一顿吃不下就不硬吃，分成**四到五次**，每次少一点。\r\n- 晚上不补白天欠的量，一次吃太多更容易胀、更容易吐。\r\n\r\n## 03 喝水和补剂\r\n\r\n- **主动喝**，不渴也喝，小口分次；恶心时慢一点。\r\n- 维生素、蛋白粉要不要补、补多少，按复查结果**由医生定**。\r\n\r\n## 04 吃不下的时候\r\n\r\n- 吃不下固体，先用奶、豆浆、蒸蛋、酸奶顶一顶。\r\n- 连续几天吃不下、体重掉得明显 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W05":"# W05 · 体重多久称一次、怎么记\r\n\r\n\u003e 导语：体重每天上下浮动很正常，盯单日数字容易白紧张。\r\n\r\n## 01 什么时候称\r\n\r\n- 每周**固定一天**的早上，起床后、上完厕所、饭前称。\r\n- **用同一台秤**，放在同一个位置，穿厚薄差不多的衣服。\r\n\r\n## 02 怎么记\r\n\r\n- 只记数字，一次一条。\r\n- **把一周的数字取平均**，看平均值的变化。\r\n\r\n## 03 数字怎么读\r\n\r\n- 单日上下浮动是正常的，不因为某天涨了就去少吃或调剂量。\r\n- 连续几周平均值不动，按「平台期怎么判断」排查，再由医生决定要不要调整。\r\n\r\n## 配图（第 03 节）\r\n- 画什么：（请医学编辑补一句，交由设计出图）\r\n- 图注：看那条深色的周均值线，不看某一个点。示意图，不代表你的下降速度。\r\n\r\n## 04 体重之外还记什么\r\n\r\n- 每周同一天量一次**腰围**，位置固定在肚脐水平。\r\n- 恶心、便秘、乏力这些反应也记一句，复查时一起给医生。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n","W06":"# W06 · 减重期间喝酒怎么处理\r\n\r\n\u003e 导语：能不喝就不喝。\r\n\r\n## 01 尽量不喝\r\n\r\n- 酒精会让食欲控制变难，热量不低，还可能加重恶心和胃部不适。\r\n- 空腹时反应更明显。\r\n- 经常喝，等于把好不容易省下来的热量又喝回去。\r\n\r\n## 02 避不开的场合\r\n\r\n- **先吃点东西**再举杯，选低度，量压到最小。\r\n- 当天的注射照常，注射时间不用跟着吃饭时间改。\r\n- 当天**多喝水、吃够蛋白质**。\r\n\r\n## 03 喝完当天怎么处理\r\n\r\n- **多喝水**，降低身体酒精浓度。\r\n- 睡前不再加餐。\r\n- 出现明显恶心、呕吐 —— 联系我们。\r\n\r\n\u003e 李医生 · 内分泌科 · 主治医师 · 更新 2026.10.13\r\n\r\n---\r\n\r\n## 用药中期（5–12 周）\r\n"};

\n  color:var(--zz-blue-3);letter-spacing:.6px}\r\n.sec-t{font-size:var(--fs-4);font-weight:700;line-height:1.5;color:var(--zz-blue-3)}\r\n\r\n/* ---------- 清单条目 ---------- */\r\n.ck{list-style:none}\r\n.ck li{position:relative;padding-left:18px;font-size:var(--fs-3);color:var(--ink);\r\n  line-height:1.85;margin-bottom:7px}\r\n.ck li:last-child{margin-bottom:0}\r\n.ck li::before{content:\"\";position:absolute;left:2px;top:10px;width:5px;height:5px;\r\n  border-radius:50%;background:var(--zz-blue-3)}\r\n.ck li b{font-weight:700}\r\n\r\n/* ---------- 名称 + 说明 ---------- */\r\n.item + .item{margin-top:var(--sp-1)}\r\n.item .nm{font-size:var(--fs-3);font-weight:700;color:var(--ink)}\r\n.item .ds{font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n\r\n/* ---------- 步骤 ---------- */\r\n.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}\r\n.step:first-child{padding-top:0}\r\n.step:last-child{border-bottom:0;padding-bottom:0}\r\n.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;\r\n  font-family:\"ZZ-Myriad\",var(--font);font-size:12px;font-weight:700;line-height:26px;text-align:center}\r\n.step .c{flex:1;min-width:0}\r\n.step .t{font-size:var(--fs-3);font-weight:700;color:var(--ink)}\r\n.step .d{font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n.step .d em{font-style:normal;font-weight:700;color:var(--accent-deep)}\r\n\r\n/* ---------- 部位 / 并列项 ---------- */\r\n.zone{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}\r\n.zone .dot{flex:0 0 5px;height:5px;border-radius:50%;background:var(--zz-blue-3);margin-top:11px}\r\n.zone .zc{flex:1;font-size:var(--fs-3);color:var(--ink-2);line-height:1.8}\r\n.zone .zc b{font-weight:700;color:var(--ink)}\r\n\r\n/* ---------- 浅蓝提示块 ---------- */\r\n.no{background:var(--accent-soft);border-radius:var(--r-xs);padding:var(--sp-1);\r\n  font-size:var(--fs-2);color:var(--accent-deep);line-height:1.8;margin-top:var(--sp-1)}\r\n.no b{font-weight:700}\r\n\r\n/* ---------- 插图 ---------- */\r\n.fig{margin-top:var(--sp-1);background:#FBFDFE;border:1px solid var(--line);\r\n  border-radius:var(--r-xs);padding:12px 12px 10px;text-align:center}\r\n.fig__tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;\r\n  color:var(--accent-deep);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-bottom:8px}\r\n.fig img,.fig svg{display:block;width:100%;height:auto;max-height:250px;margin:0 auto}\r\n.fig__cap{font-size:var(--fs-1);color:var(--ink-3);line-height:1.65;margin-top:8px;text-align:left}\r\n\r\n/* ---------- 占位图（未出图时的过渡形态） ---------- */\r\n.ph{background:#FBFDFE;border:1.5px dashed #B9D3DA;border-radius:var(--r-xs);\r\n  padding:var(--sp-2);text-align:center;margin-top:var(--sp-1);color:var(--ink-3)}\r\n.ph .pht{font-size:var(--fs-2);font-weight:700;color:var(--ink-2)}\r\n.ph .pht .pn{color:var(--accent-deep)}\r\n.ph .phd{font-size:var(--fs-1);line-height:1.8;text-align:left;background:var(--card);\r\n  border-radius:8px;padding:8px 12px;margin-top:10px}\r\n.figure{background:#FBFDFE;border:1px solid var(--line);border-radius:var(--r-xs);\r\n  padding:12px;text-align:center;margin-top:var(--sp-1);position:relative}\r\n.figure .fb{position:absolute;top:10px;right:12px;font-size:10px;color:var(--ink-3);\r\n  border:1px dashed #B9D3DA;border-radius:4px;padding:1px 7px}\r\n.figure svg{max-width:100%;height:auto}\r\n.fig-cap{font-size:var(--fs-1);color:var(--ink-3);line-height:1.65;margin-top:8px}\r\n\r\n/* ---------- 吸底 AI 按钮 ---------- */\r\n.askbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;\r\n  max-width:420px;z-index:6;padding:10px 18px calc(10px + env(safe-area-inset-bottom));\r\n  background:rgba(246,246,246,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}\r\n@media (min-width:480px){.askbar{bottom:24px;border-radius:0 0 32px 32px}}\r\n.page{padding-bottom:calc(92px + env(safe-area-inset-bottom))}\r\n.btn{display:flex;a     let m;
    if ((m = l.match(/^#\s+([WMS]\d\d)\s*·\s*(.+)$/))) { out.id = m[1]; out.title = m[2].trim(); continue; }
    if (/^>\s*导语：/.test(l)) { out.lead = l.replace(/^>\s*导语：/,'').trim(); continue; }
    if (/^>/.test(l)) { out.rev = l.replace(/^>\s*/,'').trim(); continue; }
    if ((m = l.match(/^##\s*配图\s*[（(]第\s*(\d+)\s*节[）)]/))) { figBox.n = m[1]; continue; }
    if (/^##\s*配图/.test(l)) { figBox.n = '0'; continue; }
    if ((m = l.match(/^##\s+(\d+)\s+(.+)$/))) { cur = { n:m[1], t:m[2].trim(), items:[] }; out.secs.push(cur); continue; }
    if (/^- 图注：/.test(l)) { figBox.note = l.replace(/^- 图注：/,'').trim(); continue; }
    if (/^- 画什么：/.test(l)) { continue; }
    if (/^- /.test(l) && cur) {
      const txt = l.replace(/^- /,'').trim();
      const it = txt.match(/^\*\*(.+?)\*\*\s+—\s+(.+)$/);
      cur.items.push(it ? { kind:'item', nm:it[1], ds:it[2] } : { kind:'li', txt });
    }
  }
  if (figBox.note && out.secs.length) {
    const host = out.secs.find(s => s.n === figBox.n) || out.secs[out.secs.length - 1];
    host.fig = figBox.note;
  }
  return out;
}

function articleHtml(page, id) {
  const secHtml = page.secs.map(s => {
    let inner = '';
    const lis = s.items.filter(i => i.kind === 'li');
    const its = s.items.filter(i => i.kind === 'item');
    if (lis.length) inner += '\n        <ul class="ck">' + lis.map(i => '\n          <li>' + bold(i.txt) + '</li>').join('') + '\n        </ul>';
    if (its.length) inner += its.map(i => '\n        <div class="item"><div class="nm">' + esc(i.nm) + '</div><div class="ds">' + esc(i.ds) + '</div></div>').join('');
    if (s.fig) {
      const svg = FIGS[id];
      inner += '\n        <figure class="fig">\n          <span class="fig__tag">示意图</span>\n' +
        (svg ? '          ' + svg + '\n' : '          <span class="fig__area" aria-hidden="true"></span>\n') +
        '          <figcaption class="fig__cap">' + esc(s.fig) + '</figcaption>\n        </figure>';
    }
    return '      <div class="card">\n        <div class="sec-h"><span class="sec-n">' + s.n + '</span><span class="sec-t">' + esc(s.t) + '</span></div>' + inner + '\n      </div>';
  }).join('\n\n');

  return '<div class="shell">\n  <div class="phone">\n    <header class="topbar">\n' +
    '      <button class="topbar__back" type="button" onclick="history.back()" aria-label="返回">\n' +
    '        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>\n' +
    '      </button>\n      <div class="topbar__title">科学减重</div>\n      <span class="topbar__spacer"></span>\n    </header>\n' +
    '    <main class="page">\n      <header class="art-hd">\n        <span class="art-hd__k">科学减重服务</span>\n' +
    '        <h1 class="art-hd__t">' + esc(page.title) + '</h1>\n' +
    (page.lead ? '        <p class="art-hd__lead">' + esc(page.lead) + '</p>\n' : '') +
    '      </header>\n\n' + secHtml + '\n\n' +
    '      <div class="card info">\n        <div class="ar__rv"><span class="ar__rv-i">审核</span>' + esc(page.rev) + '</div>\n' +
    '        <p class="disclaim">本篇内容仅供参考，具体情况以你的处方、药品说明书和医生指导为准。</p>\n      </div>\n\n' +
    '      <div class="askbar">\n        <button class="btn" type="button">问 AI 减重助理</button>\n      </div>\n' +
    '    </main>\n  </div>\n</div>';
}
function pageHtml(page, id) {
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n' +
    '<title>' + esc(page.title) + '</title>\n<link rel="icon" href="../assets/branding-pic/icon.png">\n' +
    '<style>\n' + HEAD + '\n</style>\n</head>\n<body>\n' + articleHtml(page, id) + '\n</body>\n</html>';
}

/* ===================== 预览 ===================== */
function render() {
  const id = CUR;
  const md = $('#md').value;
  if (!md.trim()) { $('#pvFrame').srcdoc = '<p style="padding:20px">没有内容</p>'; return; }
  $('#pvFrame').srcdoc = pageHtml(parsePage(md), id);
}
function markDirty(on) {
  DIRTY[CUR] = on;
  $('#dirtyDot').className = 'dot' + (Object.keys(DIRTY).some(k => DIRTY[k]) ? ' on' : '');
}
function say(t, cls) { const m = $('#msg'); m.textContent = t; m.className = cls || ''; }

/* ===================== 载入 ===================== */
async function loadHead() {
  if (HEAD) return;
  const t = await fetch('00-规范/科普内容页模板.html').then(r => r.text());
  const s = t.indexOf('<style>'), e = t.indexOf('</style>');
  HEAD = (s >= 0 && e > s) ? t.slice(s + 7, e) : '';
}
async function loadMeta() {
  let src = null;
  if (Object.keys(META).length) { src = META; }
  else { try { src = await fetch('文案稿/目录.json').then(r => r.json()); } catch (e) {} }
  if (!src) return;
  const list = Object.keys(src).map(k => ({ id:k, md:src[k].md, html:src[k].html }))
    .sort((a, b) => a.id.localeCompare(b.id));
  ARTICLES.length = 0;
  list.forEach(x => ARTICLES.push(x));
}
async function loadDocs() {
  if (OFFLINE) return;
  for (const a of ARTICLES) {
    DOCS[a.id] = await fetch('api/md?file=' + encodeURIComponent(a.md)).then(r => r.text());
  }
}
async function loadFigs() {
  if (OFFLINE) return;
  for (const a of ARTICLES) {
    try {
      const t = await fetch(a.html).then(r => r.text());
      const m = t.match(/<figure class="fig">[\s\S]*?(<svg[\s\S]*?<\/svg>)/);
      if (m) FIGS[a.id] = m[1].replace(/\s+/g, ' ').trim();
    } catch (e) {}
  }
}
function fillSelect() {
  $('#artSel').innerHTML = ARTICLES.map(a => {
    const t = (DOCS[a.id] || '').match(/^#\s+[WMS]\d\d\s*·\s*(.+)$/m);
    return '<option value="' + a.id + '">' + a.id + ' · ' + (t ? t[1].trim() : '') + '</option>';
  }).join('');
}
function show(id) {
  CUR = id;
  $('#artSel').value = id;
  $('#md').value = DOCS[id] || '';
  render();
}

/* ===================== 保存 / 发布 ===================== */
async function saveOne(a) {
  const r = await fetch('api/md?file=' + encodeURIComponent(a.md), { method:'POST', body: DOCS[a.id] });
  const j = await r.json();
  if (!j.ok) throw new Error('保存失败：' + a.md);
  delete DIRTY[a.id];
  markDirty(false);
}
async function regenOne(a) {
  const r = await fetch('api/page?file=' + encodeURIComponent(a.html), { method:'POST', body: pageHtml(parsePage(DOCS[a.id]), a.id) });
  const j = await r.json();
  if (!j.ok) throw new Error('回灌失败：' + a.html);
}

$('#md').addEventListener('input', () => {
  DOCS[CUR] = $('#md').value;
  markDirty(true);
  clearTimeout(window.__t); window.__t = setTimeout(render, 250);
});
$('#artSel').addEventListener('change', () => { show($('#artSel').value); });

$('#btnSave').addEventListener('click', async () => {
  const b = $('#btnSave'); b.disabled = true; say('保存中…');
  try { const a = ARTICLES.find(x => x.id === CUR); await saveOne(a); say('已保存：' + a.md, 'ok'); }
  catch (e) { say(e.message, 'err'); }
  b.disabled = false;
});

$('#btnSaveAll').addEventListener('click', async () => {
  const b = $('#btnSaveAll'); b.disabled = true; say('保存全部…');
  try {
    for (const a of ARTICLES) await saveOne(a);
    say('12 篇文案稿已保存。', 'ok');
  } catch (e) { say(e.message, 'err'); }
  b.disabled = false;
});

$('#btnPub').addEventListener('click', async () => {
  const b = $('#btnPub');
  if (OFFLINE) {
    const a = ARTICLES.find(x => x.id === CUR);
    const name = a.md.split('/').pop();
    const blob = new Blob([$('#md').value], { type:'text/markdown;charset=utf-8' });
    const el = document.createElement('a');
    el.href = URL.createObjectURL(blob); el.download = name;
    document.body.appendChild(el); el.click();
    setTimeout(() => { URL.revokeObjectURL(el.href); el.remove(); }, 1000);
    say('离线版：已导出 ' + name + '，请发回给产品侧回灌并发布到 GitHub。', 'ok');
    return;
  }
  if (!confirm('定稿：保存 12 篇文案 → 回灌 12 个页面 → 提交并推送到 GitHub？')) return;
  b.disabled = true;
  try {
    say('1/3 保存文案稿…');
    for (const a of ARTICLES) await saveOne(a);

    say('2/3 回灌页面…');
    const done = [];
    for (const a of ARTICLES) { await regenOne(a); done.push(a.id); }

    say('3/3 提交到 GitHub…（已回灌 ' + done.join(' ') + '）');
    const r = await fetch('api/publish', { method:'POST', body: JSON.stringify({ msg: $('#cmtMsg').value || '医学编辑定稿' }) });
    const j = await r.json();
    say(j.ok ? ('发布完成：\n' + (j.log || '')) : ('发布失败：\n' + (j.log || j.error || '')), j.ok ? 'ok' : 'err');
  } catch (e) { say('发布失败：' + e.message, 'err'); }
  b.disabled = false;
});

(async function init() {
  try {
    await loadHead();
    await loadMeta();
    await loadDocs();
    await loadFigs();
    fillSelect();
    // 支持 index.html 直接跳到某一篇：editor.html?id=S04
    const want = new URLSearchParams(location.search).get('id');
    const hit = want && ARTICLES.some(a => a.id === want) ? want : ARTICLES[0].id;
    show(hit);
    if (OFFLINE) { say('离线版就绪：改完点「定稿并发布」导出本页 md，发回给产品侧回灌发布。'); return; }
    const st = await fetch('api/status').then(r => r.json()).catch(() => null);
    if (st) say('就绪 · 12 页一页一稿 · Git：' + (st.repo || '未初始化') + (st.branch ? ' · ' + st.branch : '') + (st.remote ? ' · ' + st.remote : ' · 未配置远端'));
  } catch (e) { say('初始化失败：' + e.message + '（请用 start-editor.bat 打开，不要直接双击本文件）', 'err'); }
})();
</script>
